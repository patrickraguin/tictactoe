name: tictactoe
description: "Tic-Tac-Toe Flutter — Human vs CPU (Clean Architecture, Riverpod 3, Freezed, AutoRoute)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # State management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.0

  # Immutable models
  freezed_annotation: ^3.0.3

  # Routing
  auto_route: ^10.3.0

  # Local persistence
  shared_preferences: ^2.3.2
  package_info_plus: ^9.0.1

  # Pure Dart utilities (domain layer)
  meta: ^1.16.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod: any  # transitive via flutter_riverpod, needed for Override type in test helpers

  # Codegen
  build_runner: ^2.7.1
  freezed: ^3.2.3
  riverpod_generator: ^3.0.3
  auto_route_generator: ^10.2.6

  # Lints / tests
  custom_lint: ^0.8.0
  riverpod_lint: ^3.0.3
  fake_async: ^1.3.3
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
