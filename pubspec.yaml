name: tictactoe
description: "Tic-Tac-Toe Flutter — Human vs CPU (Clean Architecture, Riverpod 3, Freezed, AutoRoute)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

workspace:
  - packages/core
  - packages/features/game/domain
  - packages/features/game/data
  - packages/features/game/presentation
  - packages/features/settings/domain
  - packages/features/settings/data
  - packages/features/settings/presentation

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  auto_route: ^11.1.0
  shared_preferences: ^2.3.2

  # Local packages
  core:
    path: packages/core
  game_domain:
    path: packages/features/game/domain
  game_data:
    path: packages/features/game/data
  game_presentation:
    path: packages/features/game/presentation
  settings_domain:
    path: packages/features/settings/domain
  settings_data:
    path: packages/features/settings/data
  settings_presentation:
    path: packages/features/settings/presentation

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^10.2.0
  riverpod: any
  melos: ^7.0.0

  # Codegen
  build_runner: ^2.14.0
  freezed: ^3.2.3
  riverpod_generator: ^4.0.0+1
  auto_route_generator: ^10.4.0

  # Lints / tests
  custom_lint: ^0.8.0
  riverpod_lint: ^3.1.0
  fake_async: ^1.3.3
  mocktail: ^1.0.5

melos:
  command:
    bootstrap:
      usePubWorkspace: true
  scripts:
    codegen:
      description: Run build_runner in dependency order
      run: |
        melos exec --scope="core" -- flutter pub run build_runner build --delete-conflicting-outputs
        melos exec --scope="game_domain" -- flutter pub run build_runner build --delete-conflicting-outputs
        melos exec --scope="game_presentation" -- flutter pub run build_runner build --delete-conflicting-outputs
        melos exec --scope="settings_presentation" -- flutter pub run build_runner build --delete-conflicting-outputs
    test:all:
      description: Run all tests across all packages
      run: melos exec --dir-exists=test -- flutter test --exclude-tags golden
    analyze:
      description: Analyze all packages
      run: melos exec -- flutter analyze

flutter:
  uses-material-design: true
  generate: true
